name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add "$TARGET"

      - name: Build (static binary)
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          name="sonos-${GITHUB_REF_NAME//\//-}-x86_64-linux"
          mkdir "$name"
          cp "target/$TARGET/release/sonos" README.md "$name/"
          strip "$name/sonos"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.tar.gz*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes = this tag's section of CHANGELOG.md ("## vX.Y.Z" up to the next "## ").
          awk -v v="## $GITHUB_REF_NAME" '$0==v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" "${notes[@]}"
